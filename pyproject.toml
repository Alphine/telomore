[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telomere-evolution-lab"
version = "0.1.0"
description = "Interactive AI-for-Science lab: evolutionary search over a telomere-dynamics simulation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Telomere Evolution Lab contributors" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "streamlit>=1.35",
  "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app"]
addopts = "-q"
